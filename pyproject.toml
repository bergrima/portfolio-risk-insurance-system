[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-risk-insurance"
version = "0.1.0"
description = "Prediction-independent portfolio allocation, VPPI, and rebalancing engine"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "pytse-client>=0.19.1,<0.20",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.3,<5",
  "matplotlib>=3.9,<4",
  "ruff>=0.6,<1",
]

[project.scripts]
portfolio-insurance = "portfolio_insurance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
